version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./invoicepilot.db:/app/invoicepilot.db
    environment:
      - DATABASE_URL=sqlite:///./invoicepilot.db
      - UPLOAD_DIR=./uploads
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=gemma3:4b
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - DEMO_MODE=false
    depends_on: []
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
